name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile code
        run: python -m py_compile app.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RESOURCE_GROUP: AZ-2008
      APP_SERVICE_PLAN: asp
      LOCATION: eastus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Service Principal credentials
        id: sp_creds
        env:
          AZURE_SP_JSON: ${{ secrets.AZURE_SP_CREDENTIALS }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          python - <<'PY'
          import json
          import os

          raw = os.environ.get("AZURE_SP_JSON", "").strip()
          subscription_id = os.environ.get("AZURE_SUBSCRIPTION_ID", "").strip()

          if not raw:
            raise SystemExit("AZURE_SP_CREDENTIALS is empty.")

          try:
            data = json.loads(raw)
          except json.JSONDecodeError as exc:
            raise SystemExit(f"AZURE_SP_CREDENTIALS is not valid JSON: {exc}") from exc

          client_id = data.get("clientId") or data.get("appId")
          client_secret = data.get("clientSecret") or data.get("password")
          tenant_id = data.get("tenantId") or data.get("tenant")
          sub_id = data.get("subscriptionId") or subscription_id

          if not client_id or not client_secret or not tenant_id:
            raise SystemExit(
              "Missing credentials. Required keys: clientId/appId, clientSecret/password, tenantId/tenant."
            )

          if not sub_id:
            raise SystemExit("Missing subscriptionId in JSON and AZURE_SUBSCRIPTION_ID secret.")

          normalized = {
            "clientId": client_id,
            "clientSecret": client_secret,
            "tenantId": tenant_id,
            "subscriptionId": sub_id,
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("creds=" + json.dumps(normalized, separators=(",", ":")) + "\n")
          PY

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ steps.sp_creds.outputs.creds }}

      - name: Generate unique app name
        id: naming
        run: |
          RANDOM_SUFFIX="$(openssl rand -hex 3)"
          APP_NAME="az2008-${RANDOM_SUFFIX}"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Provision Azure resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION"

            az appservice plan create \
              --name "$APP_SERVICE_PLAN" \
              --resource-group "$RESOURCE_GROUP" \
              --sku S1 \
              --is-linux

            az webapp create \
              --name "${{ steps.naming.outputs.app_name }}" \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --runtime "PYTHON:3.12"

            az webapp config set \
              --name "${{ steps.naming.outputs.app_name }}" \
              --resource-group "$RESOURCE_GROUP" \
              --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 app:app"

      - name: Deploy application package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.naming.outputs.app_name }}
          package: .

      - name: Show deployed URL
        run: echo "https://${{ steps.naming.outputs.app_name }}.azurewebsites.net"
