{% extends 'base.html' %}

{% block content %}
<section class="card form-card">
    <h2>{% if mode == 'edit' %}Editar{% else %}Nuevo{% endif %} producto</h2>

    <form method="post" class="payment-form">
        <label>
            Nombre
            <input type="text" name="name" required value="{{ product.name if product else '' }}">
        </label>

        <label>
            SKU
            <input type="text" name="sku" required value="{{ product.sku if product else '' }}">
        </label>

        <label>
            Precio
            <input type="number" step="0.01" min="0" name="price" required value="{{ product.price if product else '' }}">
        </label>

        <label>
            Stock
            <input type="number" min="0" step="1" name="stock" required value="{{ product.stock if product else '' }}">
        </label>

        <label>
            Categoria
            <select name="category">
                {% for item in category_options %}
                    <option value="{{ item }}" {% if (product.category if product else 'otros') == item %}selected{% endif %}>{{ item|capitalize }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="full">
            Descripcion
            <textarea name="description" rows="4">{{ product.description if product else '' }}</textarea>
        </label>

        <div class="form-actions full">
            <button type="submit" class="btn">Guardar</button>
            <a class="btn btn-alt" href="{{ url_for('index') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
